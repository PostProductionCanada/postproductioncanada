name: Refresh news and deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
    - cron: "7 12,13 * * *"  # just after 8 a.m. Eastern, either side of daylight saving
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Save rolling archive
        continue-on-error: true
        run: |
          git config user.name "Post Production Canada"
          git config user.email "noreply@postproductioncanada.ca"
          git add data/archive.json data/roll.json data/roll_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update rolling archive"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
